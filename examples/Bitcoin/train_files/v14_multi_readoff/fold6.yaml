run_id: v14_multi_readoff/fold6
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: commax2022-korea-university
wandb_project: starVLA_Bitcoin
is_debug: false
version_id: "0.1"

framework:
  name: QwenGR00T
  action_prompt: "Output the predicted values"
  readoff_aux: true
  eth_loss_weight: 0.5
  dct_loss_weight: 0.1        # frequency domain loss weight
  dct_low_freq_weight: 1.0    # low-freq (trend) weight
  dct_high_freq_weight: 3.0   # high-freq (detail) weight
  dct_freq_split: 0.5
  dct_similarity_type: "mse"
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 4             # auto-overridden to 4*num_assets at runtime
    state_dim: 0
    action_horizon: 12        # next 12 one-hour candles
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: bitcoin_datasets
    data_root_dir: .
    data_mix: bitcoin_1h_80_to_12
    input_window: 80
    prediction_horizon: 12
    stride: 1
    image_size: [448, 448]
    use_image: false
    target_mode: delta
    normalize_targets: false
    timeframe_label: "hourly"
    text_precision: 2
    num_text_candles: 10
    per_device_batch_size: 2
    num_workers: 4
    assets:
      - {name: BTC, csv: crypto_data/btc_1h.csv, weight: 0.6}
      - {name: ETH, csv: crypto_data/eth_1h.csv, weight: 0.2}
      - {name: XRP, csv: crypto_data/xrp_1h.csv, weight: 0.2}
    splits:
      train:
        start: "2025-01-01"
        end: "2025-10-31"
      validation:
        start: "2025-11-01"
        end: "2025-11-30"
      test:
        start: "2025-12-01"
        end: "2025-12-31"
    columns:
      timestamp: timestamp
      open: open
      high: high
      low: low
      close: close
      volume: volume
      amount: quote_volume

trainer:
  max_train_steps: 10000
  num_warmup_steps: 500
  save_interval: 1000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: 'qwen_vl_interface'
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
